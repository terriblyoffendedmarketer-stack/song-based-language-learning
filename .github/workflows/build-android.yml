name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'songwon/android/**'
      - 'songwon/capacitor.config.ts'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: songwon
        run: npm ci

      - name: Sync Capacitor
        working-directory: songwon
        run: npx cap sync android

      - name: Build debug APK
        working-directory: songwon/android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: songwon-korean
          path: songwon/android/app/build/outputs/apk/debug/app-debug.apk
